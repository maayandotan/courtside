<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CourtSide</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0f;
    --header-bg: #14161a;
    --accent: #1d63ff;
    --text: #e8e8ea;
    --muted: #9a9ba3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--accent);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
  }
  body { display: flex; flex-direction: column; }

  #welcome {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 15% 20%, rgba(240, 80, 10, 0.35), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(108, 59, 209, 0.35), transparent 40%),
      radial-gradient(circle at 20% 85%, rgba(255, 106, 0, 0.3), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(11, 78, 162, 0.35), transparent 40%),
      var(--bg);
    animation: welcome-fade-in 0.5s ease;
  }
  @keyframes welcome-fade-in { from { opacity: 0; } to { opacity: 1; } }
  .welcome-content { text-align: center; max-width: 420px; padding: 0 24px; }
  .welcome-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 40px; }
  .welcome-brand-mark {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
  }
  .welcome-brand-name { font-size: 18px; font-weight: 800; letter-spacing: 0.02em; }
  .welcome-stage h1 { font-size: 32px; font-weight: 800; line-height: 1.2; margin: 0 0 14px; }
  .welcome-copy { font-size: 14px; color: var(--muted); margin: 0 0 20px; }
  #welcome-name-form { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #welcome-name-input {
    width: 100%;
    background: var(--header-bg);
    border: 1px solid #2a2d36;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15px;
    color: var(--text);
    text-align: center;
  }
  #welcome-name-input:focus { outline: none; border-color: var(--accent); }
  .welcome-btn {
    padding: 12px 28px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .welcome-btn:hover { filter: brightness(1.1); }
  #welcome-back-name { color: var(--accent); }

  header {
    height: 56px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--header-bg);
  }
  .wordmark { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  .subtitle { font-size: 13px; color: var(--muted); margin-left: auto; }
  .home-btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: none;
    background: #23262e;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .home-btn:hover { background: var(--accent); }

  #home {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 28px 32px;
    background: var(--bg);
  }
  .home-toolbar { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 18px; }

  /* Each league gets its own accent color so the sections read as
     distinct "channels" at a glance, like a real sports app's home
     feed — used on the section's dot and a favorited card's border. */
  .league-section[data-league="nba"] { --league-accent: #f0500a; }
  .league-section[data-league="epl"] { --league-accent: #6c3bd1; }
  .league-section[data-league="cl"] { --league-accent: #0d1f6e; }
  .league-section[data-league="nfl"] { --league-accent: #0b4ea2; }
  .league-section[data-league="euroleague"] { --league-accent: #ff6a00; }

  .league-section {
    margin-bottom: 26px;
    padding-left: 14px;
    border-left: 4px solid var(--league-accent, var(--accent));
    border-radius: 2px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--league-accent, var(--accent)) 10%, transparent), transparent 220px);
  }
  .league-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .league-logo-badge {
    width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: #f4f4f4;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--league-accent, var(--accent)) 45%, transparent);
  }
  .league-logo-badge img { width: 32px; height: 32px; object-fit: contain; }
  .league-logo-badge .league-monogram { font-size: 14px; font-weight: 800; color: var(--league-accent, var(--accent)); }
  .league-name { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--league-accent, var(--accent)); }
  .league-subtitle { font-size: 12px; color: var(--muted); }
  .league-favorite-select {
    margin-left: auto;
    background: var(--header-bg);
    color: var(--text);
    border: 1px solid #2a2d36;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 160px;
  }
  .date-stepper { display: flex; align-items: center; gap: 4px; }
  .date-step-btn {
    width: 20px; height: 20px;
    border-radius: 4px;
    border: none;
    background: #23262e;
    color: var(--text);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  .date-step-btn:hover { background: var(--league-accent, var(--accent)); }
  .date-label { font-size: 11px; color: var(--muted); min-width: 52px; text-align: center; }

  .game-rail {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 2px 2px 10px;
  }
  .game-rail::-webkit-scrollbar { height: 6px; }
  .game-rail::-webkit-scrollbar-thumb { background: #23262e; border-radius: 3px; }
  .home-empty { font-size: 13px; color: var(--muted); padding: 10px 0; }

  .game-card {
    position: relative;
    flex: 0 0 188px;
    background: var(--header-bg);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 14px 12px 10px;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .game-card:hover { border-color: var(--league-accent, var(--accent)); transform: translateY(-2px); }
  .game-card.favorite { border-color: #ffb020; }
  .game-card.selected { border-color: var(--accent); background: #1a2540; }
  .game-card .matchup-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
  .game-card .team-crest { width: 38px; height: 38px; object-fit: contain; }
  .game-card .vs-label { font-size: 10px; font-weight: 800; color: var(--muted); }
  .game-card .team-names { display: flex; gap: 6px; }
  .game-card .team-name {
    flex: 1 1 0; min-width: 0;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em;
    text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .game-card .status-pill {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #23262e;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  .game-card .fav-star { position: absolute; top: 8px; left: 10px; color: #ffb020; font-size: 12px; }
  .game-card .select-check {
    position: absolute; top: 8px; right: 8px;
    width: 18px; height: 18px; border-radius: 4px; background: var(--header-bg);
    border: 2px solid #3a3d46; display: none; align-items: center; justify-content: center; font-size: 11px;
  }
  .multi-view-on .select-check { display: flex; }
  .game-card.selected .select-check { border-color: var(--accent); background: var(--accent); }

  .multi-view-toggle {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid #2a2d36;
    background: var(--header-bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .multi-view-toggle.on { background: var(--accent); color: var(--text); border-color: var(--accent); }

  .home-banner {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    margin-bottom: 20px;
    border-radius: 8px;
    background: #1a2540;
    border: 1px solid var(--accent);
    font-size: 13px;
    max-width: 560px;
  }
  .home-banner.error { background: #2a1a1a; border-color: #b0392f; }
  .home-banner .cancel-link { margin-left: auto; color: var(--muted); cursor: pointer; text-decoration: underline; font-size: 12px; }

  .watch-selected-bar {
    display: none;
    position: sticky;
    bottom: 16px;
    margin-top: 16px;
    max-width: 560px;
  }
  .watch-selected-btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .watch-selected-btn:disabled { opacity: 0.4; cursor: not-allowed; }


  #grid { flex: 1 1 auto; display: none; }
  .pane-cell { flex: 1 1 0%; display: flex; flex-direction: column; min-width: 0; }

  .divider {
    flex: 0 0 6px;
    background: var(--header-bg);
    cursor: col-resize;
  }
  .divider:hover, .divider.dragging { background: var(--accent); }

  .pane-label {
    height: 32px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    background: var(--header-bg);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid transparent;
    border-bottom: none;
  }
  .pane-cell.focused .pane-label { border-color: var(--accent); background: #1a2540; }
  .pane-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .pane-cell.focused .pane-dot { background: var(--accent); }
  .pane-label .label-text { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-label .pane-action {
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    border: none;
    background: #23262e;
    color: var(--text);
    cursor: pointer;
  }
  .pane-label .pane-action:hover { background: var(--accent); }
  .pane-label .pane-action.close-btn:hover { background: #b0392f; }

  .pane-controls {
    height: 32px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 8px;
    background: var(--header-bg);
    border-left: 2px solid transparent;
    border-right: 2px solid transparent;
  }
  .pane-cell.focused .pane-controls { border-color: var(--accent); }
  .pane-controls button {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    border: none;
    background: #23262e;
    color: var(--text);
    cursor: pointer;
  }
  .pane-controls button:hover:not(:disabled) { background: var(--accent); }
  .pane-controls button:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.5; }
  .pane-controls .nudge { margin-left: auto; }
  .pane-controls .skip-status { font-size: 11px; color: var(--muted); margin-left: auto; }
  .pane-controls button.recap-active { background: var(--accent); cursor: default; }
  .pane-controls button.locked { display: flex; align-items: center; gap: 4px; }

  .pane-content { position: relative; flex: 1 1 auto; }
  .skeleton, .error-state {
    position: absolute;
    inset: 2px;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .skeleton-bar {
    background: var(--header-bg);
    border-radius: 8px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .skeleton .skeleton-bar:nth-child(1) { width: 60%; max-width: 340px; height: 20px; }
  .skeleton .skeleton-bar:nth-child(2) { width: 80%; max-width: 520px; height: 55%; }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 0.9; }
  }

  .error-state svg { width: 32px; height: 32px; stroke: var(--muted); }
  .error-message { font-size: 13px; color: var(--muted); max-width: 80%; text-align: center; }
  .retry-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .retry-btn:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div id="welcome">
    <div class="welcome-content">
      <div class="welcome-brand">
        <span class="welcome-brand-mark">CS</span>
        <span class="welcome-brand-name">CourtSide</span>
      </div>
      <div id="welcome-ask" class="welcome-stage">
        <h1>Every game.<br>One place.</h1>
        <p class="welcome-copy">What should we call you?</p>
        <form id="welcome-name-form">
          <input id="welcome-name-input" type="text" placeholder="Your name" maxlength="40" autocomplete="off" autofocus>
          <button type="submit" class="welcome-btn">Continue</button>
        </form>
      </div>
      <div id="welcome-back" class="welcome-stage" style="display: none;">
        <h1>Welcome back,<br><span id="welcome-back-name"></span></h1>
        <button id="welcome-enter-btn" class="welcome-btn">Enter CourtSide</button>
      </div>
    </div>
  </div>

  <header>
    <span class="wordmark">CourtSide</span>
    <button class="home-btn" id="home-btn">Home</button>
    <button class="home-btn" id="add-pane-btn" style="display: none;">+ Add game</button>
    <span class="subtitle">Click a pane's label to focus it</span>
  </header>

  <div id="home">
    <div class="home-toolbar">
      <button class="multi-view-toggle" id="multi-view-toggle">Multi-View: Off</button>
    </div>
    <div class="home-banner" id="pending-action-banner">
      <span id="pending-action-text"></span>
      <span class="cancel-link" id="pending-action-cancel">Cancel</span>
    </div>
    <div class="home-banner error" id="notice-banner">
      <span id="notice-text"></span>
      <span class="cancel-link" id="notice-dismiss">Dismiss</span>
    </div>

    <div class="league-section" data-league="nba">
      <div class="league-header">
        <span class="league-logo-badge"><img src="https://cdn.nba.com/logos/leagues/logo-nba.svg" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'league-monogram',textContent:'NBA'}))"></span>
        <span class="league-name">NBA</span>
        <span class="league-subtitle" id="home-heading">Loading&hellip;</span>
        <span class="date-stepper">
          <button class="date-step-btn" data-league="nba" data-dir="-1" title="Previous day">&lsaquo;</button>
          <span class="date-label" id="nba-date-label"></span>
          <button class="date-step-btn" data-league="nba" data-dir="1" title="Next day">&rsaquo;</button>
        </span>
        <select class="league-favorite-select" id="nba-favorite-select"><option value="">Favorite team</option></select>
      </div>
      <div class="game-rail" id="game-list"></div>
    </div>

    <div class="league-section" data-league="epl">
      <div class="league-header">
        <span class="league-logo-badge"><img src="https://a.espncdn.com/i/leaguelogos/soccer/500/23.png" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'league-monogram',textContent:'PL'}))"></span>
        <span class="league-name">Premier League</span>
        <span class="league-subtitle" id="epl-heading">Loading&hellip;</span>
        <span class="date-stepper">
          <button class="date-step-btn" data-league="epl" data-dir="-1" title="Previous week">&lsaquo;</button>
          <span class="date-label" id="epl-date-label"></span>
          <button class="date-step-btn" data-league="epl" data-dir="1" title="Next week">&rsaquo;</button>
        </span>
        <select class="league-favorite-select" id="epl-favorite-select"><option value="">Favorite team</option></select>
      </div>
      <div class="game-rail" id="epl-list"></div>
    </div>

    <div class="league-section" data-league="cl">
      <div class="league-header">
        <span class="league-logo-badge"><img src="https://a.espncdn.com/i/leaguelogos/soccer/500/2.png" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'league-monogram',textContent:'CL'}))"></span>
        <span class="league-name">Champions League</span>
        <span class="league-subtitle" id="cl-heading">Loading&hellip;</span>
        <span class="date-stepper">
          <button class="date-step-btn" data-league="cl" data-dir="-1" title="Previous week">&lsaquo;</button>
          <span class="date-label" id="cl-date-label"></span>
          <button class="date-step-btn" data-league="cl" data-dir="1" title="Next week">&rsaquo;</button>
        </span>
        <select class="league-favorite-select" id="cl-favorite-select"><option value="">Favorite team</option></select>
      </div>
      <div class="game-rail" id="cl-list"></div>
    </div>

    <div class="league-section" data-league="nfl">
      <div class="league-header">
        <span class="league-logo-badge"><img src="https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'league-monogram',textContent:'NFL'}))"></span>
        <span class="league-name">NFL</span>
        <span class="league-subtitle" id="nfl-heading">Loading&hellip;</span>
        <span class="date-stepper">
          <button class="date-step-btn" data-league="nfl" data-dir="-1" title="Previous week">&lsaquo;</button>
          <span class="date-label" id="nfl-date-label"></span>
          <button class="date-step-btn" data-league="nfl" data-dir="1" title="Next week">&rsaquo;</button>
        </span>
        <select class="league-favorite-select" id="nfl-favorite-select"><option value="">Favorite team</option></select>
      </div>
      <div class="game-rail" id="nfl-list"></div>
    </div>

    <div class="league-section" data-league="euroleague">
      <div class="league-header">
        <span class="league-logo-badge"><img src="https://upload.wikimedia.org/wikipedia/commons/9/90/EuroLeague_logo.svg" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'league-monogram',textContent:'EL'}))"></span>
        <span class="league-name">EuroLeague</span>
        <span class="league-subtitle" id="el-heading">Loading&hellip;</span>
        <span class="date-stepper">
          <button class="date-step-btn" data-league="euroleague" data-dir="-1" title="Previous week">&lsaquo;</button>
          <span class="date-label" id="el-date-label"></span>
          <button class="date-step-btn" data-league="euroleague" data-dir="1" title="Next week">&rsaquo;</button>
        </span>
        <select class="league-favorite-select" id="el-favorite-select"><option value="">Favorite team</option></select>
      </div>
      <div class="game-rail" id="el-list"></div>
    </div>

    <div class="watch-selected-bar" id="watch-selected-bar">
      <button class="watch-selected-btn" id="watch-selected-btn" disabled>Watch Selected (0)</button>
    </div>
  </div>

  <div id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const homeView = document.getElementById('home');
    const cells = new Map(); // keyed by stable pane id, not grid position
    const skipCapableById = new Map();
    const addPaneBtn = document.getElementById('add-pane-btn');

    // --- Multi-view / pending-pane-action state (all renderer-side;
    // main.js just gets told which exact games to open/add/replace) ---
    let multiViewMode = false;
    let selectedGames = []; // up to 4 generic game descriptors
    // { type: 'replace', paneId, label } | { type: 'add' } | null — set
    // by a pane's Swap button or the header's "+ Add game" button, so
    // the NEXT home-page click routes into that specific pane instead
    // of opening a fresh grid.
    let pendingAction = null;

    function gameKey(g) {
      if (g.league === 'nba') return `nba:${g.gameId}`;
      return `${g.league}:${g.homeName}|${g.awayName}`;
    }

    let paneCount = 0;
    let inGridView = false;

    // Up to 2 panes uses the existing flex row (so the draggable
    // splitRatio divider, which only understands exactly 2 panes,
    // keeps working unchanged). 3-4 panes switches #grid to CSS Grid —
    // this MUST mirror layoutPanes' row/col math in main.js exactly,
    // since that function positions the actual native WebContentsViews
    // independently of this DOM chrome; a mismatch there is what made
    // 3/4-pane grids look broken (labels laid out in one row while the
    // real video panes sat in a wrapped 2-column grid underneath).
    function applyGridDisplayMode() {
      if (!inGridView) { grid.style.display = 'none'; return; }
      if (paneCount <= 2) {
        grid.style.display = 'flex';
        grid.style.gridTemplateColumns = '';
        grid.style.gridTemplateRows = '';
      } else {
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
        grid.style.gridTemplateRows = 'repeat(2, 1fr)';
      }
    }

    function updateAddPaneVisibility() {
      addPaneBtn.style.display = inGridView && paneCount > 0 && paneCount < 4 ? 'inline-block' : 'none';
    }

    function showHome() {
      inGridView = false;
      applyGridDisplayMode();
      homeView.style.display = 'block';
      addPaneBtn.style.display = 'none';
    }
    function showGrid() {
      inGridView = true;
      homeView.style.display = 'none';
      applyGridDisplayMode();
      pendingAction = null;
      updatePendingBanner();
      updateAddPaneVisibility();
    }

    document.getElementById('home-btn').addEventListener('click', () => {
      pendingAction = null;
      updatePendingBanner();
      showHome();
      window.courtside.showHome();
    });
    window.courtside.onShowGrid(showGrid);
    window.courtside.onReturnHome(showHome);

    addPaneBtn.addEventListener('click', () => {
      pendingAction = { type: 'add' };
      multiViewMode = false;
      selectedGames = [];
      updateMultiViewUI();
      updatePendingBanner();
      showHome();
      window.courtside.showHome();
    });

    // --- Home page: one config per league drives a single generic
    // render path instead of five near-identical copy-pasted ones. Each
    // config's buildGame() turns one raw match into everything the
    // generic card renderer needs: the game descriptor (for
    // open/add/replace-pane and multi-view selection, unchanged from
    // before), display fields, and which two team identifiers count as
    // "this league's favorite" for that game.
    const multiViewToggle = document.getElementById('multi-view-toggle');
    const pendingBanner = document.getElementById('pending-action-banner');
    const pendingText = document.getElementById('pending-action-text');
    const noticeBanner = document.getElementById('notice-banner');
    const noticeText = document.getElementById('notice-text');
    const watchSelectedBar = document.getElementById('watch-selected-bar');
    const watchSelectedBtn = document.getElementById('watch-selected-btn');
    let favoriteTeams = {}; // { nba: 'NYK', epl: 'Arsenal', ... } — per league

    function todayIso() { return new Date().toISOString().slice(0, 10); }
    function formatDateLabel(dateStr) {
      return new Date(`${dateStr}T12:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    const leagueConfigs = [
      {
        league: 'nba',
        listEl: document.getElementById('game-list'),
        headingEl: document.getElementById('home-heading'),
        selectEl: document.getElementById('nba-favorite-select'),
        dateLabelEl: document.getElementById('nba-date-label'),
        stepUnit: 'day',
        anchorDate: todayIso(),
        fetchFn: (dateStr) => window.courtside.getHomeData(dateStr),
        data: { heading: '', matches: [] },
        emptyText: 'No games to show right now.',
        // NBA has a real full roster (NBA_TEAMS/get-teams) — every
        // other league's picker is populated from currently-loaded
        // games instead (see refreshFavoriteOptions).
        fixedRoster: null,
        buildGame(m) {
          return {
            game: { league: 'nba', gameId: m.gameId, awayTricode: m.awayTricode, homeTricode: m.homeTricode, awayName: m.awayName, homeName: m.homeName },

          };
        },
      },
      {
        league: 'epl',
        listEl: document.getElementById('epl-list'),
        headingEl: document.getElementById('epl-heading'),
        selectEl: document.getElementById('epl-favorite-select'),
        dateLabelEl: document.getElementById('epl-date-label'),
        stepUnit: 'week',
        anchorDate: todayIso(),
        fetchFn: (dateStr) => window.courtside.getEplHomeData(dateStr),
        data: { heading: '', matches: [] },
        emptyText: 'No matches to show right now.',
        buildGame(m) {
          return {
            game: { league: 'epl', homeName: m.homeName, awayName: m.awayName },
            leftName: m.homeName,
            rightName: m.awayName,
            leftCrest: m.homeCrest,

        dateLabelEl: document.getElementById('cl-date-label'),

        fetchFn: (dateStr) => window.courtside.getClHomeData(dateStr),
        data: { heading: '', matches: [] },
        emptyText: 'No matches to show right now.',
        buildGame(m) {

            leftName: m.homeName,
            rightName: m.awayName,
            leftCrest: m.homeCrest,
            rightCrest: m.awayCrest,

      },
      {
        league: 'nfl',
        listEl: document.getElementById('nfl-list'),
        headingEl: document.getElementById('nfl-heading'),
        selectEl: document.getElementById('nfl-favorite-select'),
        dateLabelEl: document.getElementById('nfl-date-label'),
        stepUnit: 'week',
        anchorDate: todayIso(),
        fetchFn: (dateStr) => window.courtside.getNflHomeData(dateStr),
        data: { heading: '', matches: [] },
        emptyText: 'No games to show right now.',
        buildGame(m) {
          return {
            game: { league: 'nfl', homeName: m.homeName, awayName: m.awayName },
            leftName: m.awayName,
            rightName: m.homeName,
            leftCrest: m.awayCrest,
            rightCrest: m.homeCrest,
            separator: '@',
            statusText: m.date,
            favoriteCandidates: [m.homeName, m.awayName],

      },
      {
        league: 'euroleague',
        listEl: document.getElementById('el-list'),
        headingEl: document.getElementById('el-heading'),
        selectEl: document.getElementById('el-favorite-select'),
        dateLabelEl: document.getElementById('el-date-label'),
        stepUnit: 'week',
        anchorDate: todayIso(),
        fetchFn: (dateStr) => window.courtside.getEuroLeagueHomeData(dateStr),
        data: { heading: '', matches: [] },
        emptyText: 'No games to show right now.',
        buildGame(m) {
          return {
            game: { league: 'euroleague', homeName: m.homeName, awayName: m.awayName, homeShort: m.homeShort, awayShort: m.awayShort },
            leftName: m.homeName,
            rightName: m.awayName,
            leftCrest: m.homeCrest,
            rightCrest: m.awayCrest,
            separator: 'v',
            statusText: m.date,
            favoriteCandidates: [m.homeName, m.awayName],
            rosterCandidates: [m.homeName, m.awayName],
          };
        },

    ];

    async function loadHomeView() {
      const [nbaTeams, nflTeams, elTeams, savedFavorites, ...leagueData] = await Promise.all([
        window.courtside.getTeams(),
        window.courtside.getNflTeams(),
        window.courtside.getEuroLeagueTeams(),
        window.courtside.getFavoriteTeams(),
        ...leagueConfigs.map((c) => c.fetchFn(c.anchorDate)),
      ]);
      favoriteTeams = savedFavorites || {};
      const byLeague = (league) => leagueConfigs.find((c) => c.league === league);
      byLeague('nba').fixedRoster = nbaTeams.map((t) => ({ value: t.tricode, label: t.name }));
      // NFL/EuroLeague get a full roster (fetched from the same source
      // as their own home data, so names match exactly) rather than
      // deriving options from whichever games happen to be loaded —
      // confirmed live that missed any team that hadn't played
      // recently. EPL/CL keep deriving from loaded games, since a
      // matchday's worth of fixtures already covers most/all clubs.
      if (nflTeams.length) byLeague('nfl').fixedRoster = nflTeams.map((name) => ({ value: name, label: name }));
      if (elTeams.length) byLeague('euroleague').fixedRoster = elTeams.map((name) => ({ value: name, label: name }));
      leagueConfigs.forEach((config, i) => {
        config.data = leagueData[i];
      });
      // If a league is between seasons/rounds, "today" (or this week)
      // often has nothing to show — walk the anchor backward (by the
      // league's own step unit) until real games turn up, so the
      // DEFAULT view lands on the last real games rather than an empty
      // page the user has to manually step back out of. Only runs once
      // at load — any stepping the user does afterward is left alone.
      await Promise.all(leagueConfigs.map((config) => ensureNonEmpty(config)));
      leagueConfigs.forEach(updateDateLabel);
      leagueConfigs.forEach(refreshFavoriteOptions);
      renderAll();
    }

    async function ensureNonEmpty(config) {
      if (config.data.matches.length > 0) return;

      // Each fetch function already knows how to find the true most
      // recent date with real games when given no date at all (NBA's
      // leaguegamefinder fallback, EuroLeague's last-completed-season
      // fallback) — try that first, since a multi-month off-season gap
      // can't reliably be crossed by a bounded day/week walk-back below.
      try {
        const fallback = await config.fetchFn(undefined);
        if (fallback.matches.length > 0) {
          config.data = fallback;
          const dates = fallback.matches.map((m) => m.date).filter(Boolean);
          if (dates.length > 0) config.anchorDate = dates.reduce((a, b) => (b > a ? b : a));
          return;
        }
      } catch (e) { /* fall through to manual walk-back */ }

      const days = config.stepUnit === 'day' ? 1 : 7;
      let attempts = 0;
      while (config.data.matches.length === 0 && attempts < 12) {
        const anchor = new Date(`${config.anchorDate}T12:00:00Z`);
        anchor.setUTCDate(anchor.getUTCDate() - days);
        config.anchorDate = anchor.toISOString().slice(0, 10);
        config.data = await config.fetchFn(config.anchorDate);
        attempts += 1;
      }
    }

    function updateDateLabel(config) {
      config.dateLabelEl.textContent = formatDateLabel(config.anchorDate);
    }

    // Steps one league's date/week anchor and refetches + re-renders
    // just that section — other leagues are untouched.
    async function stepLeagueDate(config, dir) {
      const days = config.stepUnit === 'day' ? 1 : 7;
      const anchor = new Date(`${config.anchorDate}T12:00:00Z`);
      anchor.setUTCDate(anchor.getUTCDate() + dir * days);
      config.anchorDate = anchor.toISOString().slice(0, 10);
      updateDateLabel(config);
      config.data = await config.fetchFn(config.anchorDate);
      refreshFavoriteOptions(config);
      renderLeagueSection(config);
    }
    document.querySelectorAll('.date-step-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const config = leagueConfigs.find((c) => c.league === btn.dataset.league);
        stepLeagueDate(config, Number(btn.dataset.dir));
      });
    });

    // Populates a league's favorite-team <select> — NBA uses its real
    // fetched roster; every other league derives options from whatever
    // teams are in its currently-loaded games (no separate roster fetch
    // per league, consistent with the rest of the home page's
    // skeleton-first scope).
    function refreshFavoriteOptions(config) {
      let options = config.fixedRoster;
      if (!options) {
        const seen = new Map();
        config.data.matches.forEach((m) => {
          const built = config.buildGame(m);
          built.rosterCandidates.forEach((name) => seen.set(name, name));
        });
        options = [...seen.keys()].sort().map((name) => ({ value: name, label: name }));
      }
      const current = favoriteTeams[config.league] || '';
      config.selectEl.innerHTML = '<option value="">Favorite team</option>' +
        options.map((o) => `<option value="${o.value}">${o.label}</option>`).join('');
      config.selectEl.value = current;
    }

    leagueConfigs.forEach((config) => {
      config.selectEl.addEventListener('change', () => {
        const name = config.selectEl.value || null;
        favoriteTeams[config.league] = name;
        window.courtside.setFavoriteTeam(config.league, name);
        renderLeagueSection(config);
      });
    });

    // Clicking a game card does one of three things depending on mode:
    // routes into a pending Swap/Add target, toggles selection in
    // multi-view mode, or (default) opens a fresh grid with just this
    // one game — never the old "always shows NBA + Prem" behavior.
    function handleGameClick(game) {
      if (pendingAction) {
        if (pendingAction.type === 'replace') window.courtside.replacePane(pendingAction.paneId, game);
        else window.courtside.addPane(game);
        pendingAction = null;
        updatePendingBanner();
        return;
      }
      if (multiViewMode) {
        const key = gameKey(game);
        const idx = selectedGames.findIndex((g) => gameKey(g) === key);
        if (idx >= 0) selectedGames.splice(idx, 1);
        else if (selectedGames.length < 4) selectedGames.push(game);
        renderAll();
        updateWatchSelectedUI();
        return;
      }
      window.courtside.openGames([game]);
    }

    function updatePendingBanner() {
      if (pendingAction) {
        pendingBanner.style.display = 'flex';
        pendingText.textContent = pendingAction.type === 'replace'
          ? `Picking a replacement for "${pendingAction.label}" — click a game below.`
          : 'Adding a new game to the view — click a game below.';
      } else {
        pendingBanner.style.display = 'none';
      }
    }
    document.getElementById('pending-action-cancel').addEventListener('click', () => {
      pendingAction = null;
      updatePendingBanner();
    });
    document.getElementById('notice-dismiss').addEventListener('click', () => {
      noticeBanner.style.display = 'none';
    });
    window.courtside.onHomeNotice(({ message }) => {
      noticeText.textContent = message;
      noticeBanner.style.display = 'flex';
    });

    function updateMultiViewUI() {
      multiViewToggle.textContent = `Multi-View: ${multiViewMode ? 'On' : 'Off'}`;
      multiViewToggle.classList.toggle('on', multiViewMode);
      leagueConfigs.forEach((config) => config.listEl.classList.toggle('multi-view-on', multiViewMode));
      updateWatchSelectedUI();
    }
    function updateWatchSelectedUI() {
      watchSelectedBar.style.display = multiViewMode ? 'block' : 'none';
      watchSelectedBtn.textContent = `Watch Selected (${selectedGames.length})`;
      watchSelectedBtn.disabled = selectedGames.length === 0;
    }
    multiViewToggle.addEventListener('click', () => {
      multiViewMode = !multiViewMode;
      if (!multiViewMode) selectedGames = [];
      pendingAction = null;
      updatePendingBanner();
      updateMultiViewUI();
      renderAll();
    });
    watchSelectedBtn.addEventListener('click', () => {
      if (selectedGames.length === 0) return;
      window.courtside.openGames(selectedGames);
      multiViewMode = false;
      selectedGames = [];
      updateMultiViewUI();
    });

    function renderAll() {
      leagueConfigs.forEach(renderLeagueSection);
    }

    function renderLeagueSection(config) {
      const { data, listEl, headingEl } = config;
      headingEl.textContent = data.heading;
      listEl.innerHTML = '';
      if (data.matches.length === 0) {
        listEl.innerHTML = `<div class="home-empty">${config.emptyText}</div>`;
        return;
      }
      data.matches.forEach((match) => {
        const built = config.buildGame(match);
        const fav = favoriteTeams[config.league];
        const isFavorite = !!fav && built.favoriteCandidates.includes(fav);
        const isSelected = multiViewMode && selectedGames.some((s) => gameKey(s) === gameKey(built.game));
        const card = document.createElement('div');
        card.className = 'game-card' + (isFavorite ? ' favorite' : '') + (isSelected ? ' selected' : '');
        card.innerHTML = `
          ${isFavorite ? '<span class="fav-star">★</span>' : ''}
          <span class="select-check">${isSelected ? '✓' : ''}</span>
          <div class="matchup-row">
            <img class="team-crest" src="${built.leftCrest}" onerror="this.style.display='none'">
            <span class="vs-label">${built.separator}</span>
            <img class="team-crest" src="${built.rightCrest}" onerror="this.style.display='none'">
          </div>
          <div class="team-names">
            <span class="team-name">${built.leftName}</span>
            <span class="team-name">${built.rightName}</span>
          </div>
          <div class="status-pill">${built.statusText}</div>
        `;
        card.addEventListener('click', () => handleGameClick(built.game));
        listEl.appendChild(card);
      });
    }

    initWelcome();

    async function initWelcome() {
      const welcomeEl = document.getElementById('welcome');
      const askStage = document.getElementById('welcome-ask');
      const backStage = document.getElementById('welcome-back');
      const nameForm = document.getElementById('welcome-name-form');
      const nameInput = document.getElementById('welcome-name-input');
      const backNameEl = document.getElementById('welcome-back-name');
      const enterBtn = document.getElementById('welcome-enter-btn');

      function enterApp() {
        welcomeEl.style.display = 'none';
        showHome();
        loadHomeView();
      }

      const existingName = await window.courtside.getUserName();
      if (existingName) {
        backNameEl.textContent = existingName;
        askStage.style.display = 'none';
        backStage.style.display = 'block';
      } else {
        askStage.style.display = 'block';
        backStage.style.display = 'none';
      }

      nameForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        if (!name) return;
        window.courtside.setUserName(name);
        backNameEl.textContent = name;
        askStage.style.display = 'none';
        backStage.style.display = 'block';
      });

      enterBtn.addEventListener('click', enterApp);
    }

    function buildPaneCell(id, label, skipCapable, league) {
      skipCapableById.set(id, skipCapable);

      const cell = document.createElement('div');
      cell.className = 'pane-cell';

      // NFL panes land on DAZN's free "Short Highlights" for the game
      // (no subscription needed) — Ad-Free Replay/Full Replay/Game in
      // 40 all require an NFL Game Pass subscription this app never
      // tries to unlock, so "Full Game" is shown locked rather than
      // omitted, matching DAZN's own UI for those same options.
      let controlsHtml;
      if (skipCapable) {
        controlsHtml = `
          <div class="pane-controls">
            <button data-quarter="1" disabled>Q1</button>
            <button data-quarter="2" disabled>Q2</button>
            <button data-quarter="3" disabled>Q3</button>
            <button data-quarter="4" disabled>Q4</button>
            <span class="skip-status nudge">loading&hellip;</span>
            <button class="nudge-prev" disabled>&lsaquo;</button>
            <button class="nudge-next" disabled>&rsaquo;</button>
          </div>
        `;
      } else if (league === 'nfl') {
        controlsHtml = `
          <div class="pane-controls">
            <button class="recap-active" disabled>Recap</button>
            <button class="locked" disabled title="Requires an NFL Game Pass subscription">🔒 Full Game</button>
          </div>
        `;
      } else {
        controlsHtml = `<div class="pane-controls"></div>`;
      }

      cell.innerHTML = `
        <div class="pane-label">
          <span class="pane-dot"></span>
          <span class="label-text">${label}</span>
          <button class="pane-action swap-btn" title="Swap this pane's game">⇄</button>
          <button class="pane-action close-btn" title="Close this pane">✕</button>
        </div>
        ${controlsHtml}
        <div class="pane-content">
          <div class="skeleton">
            <div class="skeleton-bar"></div>
            <div class="skeleton-bar"></div>
          </div>
          <div class="error-state">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
            </svg>
            <div class="error-message">Stream failed to load.</div>
            <button class="retry-btn">Retry</button>
          </div>
        </div>
      `;
      cell.querySelector('.pane-dot').addEventListener('click', () => window.courtside.focusPane(id));
      cell.querySelector('.label-text').addEventListener('click', () => window.courtside.focusPane(id));
      cell.querySelector('.retry-btn').addEventListener('click', () => {
        window.courtside.retryPane(id);
      });
      cell.querySelector('.close-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        window.courtside.closePane(id);
      });
      cell.querySelector('.swap-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        pendingAction = { type: 'replace', paneId: id, label };
        multiViewMode = false;
        selectedGames = [];
        updateMultiViewUI();
        updatePendingBanner();
        showHome();
        window.courtside.showHome();
      });
      if (skipCapable) {
        cell.querySelectorAll('.pane-controls button[data-quarter]').forEach((btn) => {
          btn.addEventListener('click', () => {
            window.courtside.jumpToQuarter(id, Number(btn.dataset.quarter));
          });
        });
        cell.querySelector('.nudge-prev').addEventListener('click', () => {
          window.courtside.nudgeQuarter(id, 'prev');
        });
        cell.querySelector('.nudge-next').addEventListener('click', () => {
          window.courtside.nudgeQuarter(id, 'next');
        });
      }
      return cell;
    }

    // Draggable divider — only meaningful for exactly 2 panes (matches
    // main.js's layoutPanes, which only understands a splitRatio for
    // n===2; a future 4-up grid would need per-row/column dividers).
    let splitRatio = 0.5;

    function setSplitRatio(ratio, cellA, cellB) {
      splitRatio = Math.max(0.2, Math.min(0.8, ratio));
      cellA.style.flex = `0 0 ${splitRatio * 100}%`;
      cellB.style.flex = `0 0 ${(1 - splitRatio) * 100}%`;
      window.courtside.setSplitRatio(splitRatio);
    }

    function buildDivider(cellA, cellB) {
      const divider = document.createElement('div');
      divider.className = 'divider';
      let dragging = false;

      const onMove = (e) => {
        if (!dragging) return;
        const gridRect = grid.getBoundingClientRect();
        setSplitRatio((e.clientX - gridRect.left) / gridRect.width, cellA, cellB);
      };
      const onUp = () => {
        dragging = false;
        divider.classList.remove('dragging');
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      divider.addEventListener('mousedown', () => {
        dragging = true;
        divider.classList.add('dragging');
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });
      return divider;
    }

    // Rebuilding all pane-cell DOM on every config change is cheap and
    // simple — it does NOT touch the underlying native WebContentsViews
    // (a completely separate layer managed entirely in main.js), so
    // panes whose content didn't change keep playing uninterrupted even
    // though their chrome/controls get torn down and rebuilt here.
    window.courtside.onPanesConfig((panes) => {
      grid.innerHTML = '';
      cells.clear();
      panes.forEach(({ id, label, skipCapable, league }) => {
        const cell = buildPaneCell(id, label, skipCapable, league);
        grid.appendChild(cell);
        cells.set(id, cell);
      });
      paneCount = panes.length;
      applyGridDisplayMode();
      if (panes.length === 2) {
        const [cellA, cellB] = [cells.get(panes[0].id), cells.get(panes[1].id)];
        cellA.style.flex = `0 0 ${splitRatio * 100}%`;
        cellB.style.flex = `0 0 ${(1 - splitRatio) * 100}%`;
        grid.insertBefore(buildDivider(cellA, cellB), cellB);
      } else if (panes.length >= 3) {
        // Mirrors layoutPanes' row/col math in main.js exactly: 2
        // columns, wrapping rows, and a lone last-row pane (3-pane
        // case) spans the full width instead of leaving a gap.
        const cols = 2;
        panes.forEach(({ id }, i) => {
          const cell = cells.get(id);
          const row = Math.floor(i / cols);
          const col = i % cols;
          const colsInRow = Math.min(cols, panes.length - row * cols);
          cell.style.gridRow = `${row + 1} / span 1`;
          cell.style.gridColumn = colsInRow === 1 ? '1 / -1' : `${col + 1} / span 1`;
        });
      }
      updateAddPaneVisibility();
    });

    window.courtside.onPaneStatus(({ id, state, message }) => {
      const cell = cells.get(id);
      if (!cell) return;
      cell.querySelector('.skeleton').style.display = state === 'loading' ? 'flex' : 'none';
      const errorEl = cell.querySelector('.error-state');
      errorEl.style.display = state === 'error' ? 'flex' : 'none';
      if (state === 'error') {
        cell.querySelector('.error-message').textContent = message || 'Stream failed to load.';
      }
    });

    window.courtside.onFocusChanged(({ id }) => {
      cells.forEach((cell, cellId) => {
        cell.classList.toggle('focused', cellId === id);
      });
    });

    // Quarter/nudge buttons are only enabled once the focused pane's
    // manifest is captured AND confirmed to be a VOD with usable
    // discontinuity data — never for a still-live game (skipping to a
    // quarter that hasn't happened yet is meaningless), matching the
    // v1 scope decision that Q2/Q4 are a coarse hint requiring the
    // nudge buttons, not a guaranteed-precise jump.
    window.courtside.onPaneSkipState(({ id, ready, reason }) => {
      const cell = cells.get(id);
      if (!cell || !skipCapableById.get(id)) return;
      cell.querySelectorAll('.pane-controls button').forEach((btn) => {
        btn.disabled = !ready;
      });
      const status = cell.querySelector('.skip-status');
      if (status) status.textContent = ready ? '' : reason || 'loading…';
    });
  </script>
</body>
</html>
