<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CourtSide</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0f;
    --header-bg: #14161a;
    --accent: #1d63ff;
    --text: #e8e8ea;
    --muted: #9a9ba3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--accent);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
  }
  body { display: flex; flex-direction: column; }

  header {
    height: 56px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--header-bg);
  }
  .wordmark { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  .subtitle { font-size: 13px; color: var(--muted); margin-left: auto; }
  .home-btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: none;
    background: #23262e;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .home-btn:hover { background: var(--accent); }

  #home {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px 32px;
    background: var(--bg);
  }
  .home-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .home-toolbar label { font-size: 13px; color: var(--muted); }
  .home-toolbar select {
    background: var(--header-bg);
    color: var(--text);
    border: 1px solid #2a2d36;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .home-heading { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 12px; }
  .game-list { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
  .game-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--header-bg);
    border: 2px solid transparent;
    border-radius: 8px;
    cursor: pointer;
  }
  .game-row:hover { border-color: var(--accent); }
  .game-row .matchup { font-size: 14px; font-weight: 600; flex: 1 1 auto; display: flex; align-items: center; gap: 8px; }
  .game-row .status { font-size: 12px; color: var(--muted); }
  .game-row.favorite { border-color: #ffb020; }
  .game-row .fav-star { color: #ffb020; margin-right: 4px; }
  .home-empty { font-size: 13px; color: var(--muted); }
  .team-crest { width: 22px; height: 22px; object-fit: contain; flex: 0 0 auto; }

  #grid { flex: 1 1 auto; display: none; }
  .pane-cell { flex: 1 1 0%; display: flex; flex-direction: column; min-width: 0; }

  .divider {
    flex: 0 0 6px;
    background: var(--header-bg);
    cursor: col-resize;
  }
  .divider:hover, .divider.dragging { background: var(--accent); }

  .pane-label {
    height: 32px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    background: var(--header-bg);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid transparent;
    border-bottom: none;
  }
  .pane-cell.focused .pane-label { border-color: var(--accent); background: #1a2540; }
  .pane-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .pane-cell.focused .pane-dot { background: var(--accent); }

  .pane-controls {
    height: 32px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 8px;
    background: var(--header-bg);
    border-left: 2px solid transparent;
    border-right: 2px solid transparent;
  }
  .pane-cell.focused .pane-controls { border-color: var(--accent); }
  .pane-controls button {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    border: none;
    background: #23262e;
    color: var(--text);
    cursor: pointer;
  }
  .pane-controls button:hover:not(:disabled) { background: var(--accent); }
  .pane-controls button:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.5; }
  .pane-controls .nudge { margin-left: auto; }
  .pane-controls .skip-status { font-size: 11px; color: var(--muted); margin-left: auto; }

  .pane-content { position: relative; flex: 1 1 auto; }
  .skeleton, .error-state {
    position: absolute;
    inset: 2px;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .skeleton-bar {
    background: var(--header-bg);
    border-radius: 8px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .skeleton .skeleton-bar:nth-child(1) { width: 60%; max-width: 340px; height: 20px; }
  .skeleton .skeleton-bar:nth-child(2) { width: 80%; max-width: 520px; height: 55%; }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 0.9; }
  }

  .error-state svg { width: 32px; height: 32px; stroke: var(--muted); }
  .error-message { font-size: 13px; color: var(--muted); max-width: 80%; text-align: center; }
  .retry-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .retry-btn:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <header>
    <span class="wordmark">CourtSide</span>
    <button class="home-btn" id="home-btn">Home</button>
    <span class="subtitle">Click a pane's label to focus it</span>
  </header>

  <div id="home">
    <div class="home-toolbar">
      <label for="favorite-team-select">Favorite team</label>
      <select id="favorite-team-select">
        <option value="">None</option>
      </select>
    </div>
    <div class="home-heading" id="home-heading">Loading&hellip;</div>
    <div class="game-list" id="game-list"></div>

    <div class="home-heading" id="epl-heading" style="margin-top: 32px;">Loading&hellip;</div>
    <div class="game-list" id="epl-list"></div>
  </div>

  <div id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const homeView = document.getElementById('home');
    const cells = new Map();
    const skipCapableByIndex = new Map();

    function showHome() {
      grid.style.display = 'none';
      homeView.style.display = 'block';
    }
    function showGrid() {
      homeView.style.display = 'none';
      grid.style.display = 'flex';
    }

    document.getElementById('home-btn').addEventListener('click', () => {
      showHome();
      window.courtside.showHome();
    });
    window.courtside.onShowGrid(showGrid);

    // --- Home page: favorite team + game list ---
    const favoriteSelect = document.getElementById('favorite-team-select');
    const homeHeading = document.getElementById('home-heading');
    const gameList = document.getElementById('game-list');
    let favoriteTeam = null;

    async function loadHomeView() {
      const [teams, savedFavorite, homeData, eplData] = await Promise.all([
        window.courtside.getTeams(),
        window.courtside.getFavoriteTeam(),
        window.courtside.getHomeData(),
        window.courtside.getEplHomeData(),
      ]);
      favoriteTeam = savedFavorite;
      favoriteSelect.innerHTML = '<option value="">None</option>' +
        teams.map((t) => `<option value="${t.tricode}">${t.name}</option>`).join('');
      favoriteSelect.value = favoriteTeam || '';
      renderGames(homeData);
      renderEplMatches(eplData);
    }

    favoriteSelect.addEventListener('change', () => {
      favoriteTeam = favoriteSelect.value || null;
      window.courtside.setFavoriteTeam(favoriteTeam);
      renderGames(lastHomeData);
    });

    let lastHomeData = { heading: '', games: [] };

    function renderGames(homeData) {
      lastHomeData = homeData;
      homeHeading.textContent = homeData.heading;
      gameList.innerHTML = '';
      if (homeData.games.length === 0) {
        gameList.innerHTML = '<div class="home-empty">No games to show right now.</div>';
        return;
      }
      homeData.games.forEach((game) => {
        const isFavorite = favoriteTeam && (game.awayTricode === favoriteTeam || game.homeTricode === favoriteTeam);
        const awayLogo = `https://a.espncdn.com/i/teamlogos/nba/500/${game.awayTricode.toLowerCase()}.png`;
        const homeLogo = `https://a.espncdn.com/i/teamlogos/nba/500/${game.homeTricode.toLowerCase()}.png`;
        const row = document.createElement('div');
        row.className = 'game-row' + (isFavorite ? ' favorite' : '');
        row.innerHTML = `
          <span class="matchup">
            ${isFavorite ? '<span class="fav-star">★</span>' : ''}
            <img class="team-crest" src="${awayLogo}" onerror="this.style.display='none'">
            ${game.awayName} @ ${game.homeName}
            <img class="team-crest" src="${homeLogo}" onerror="this.style.display='none'">
          </span>
          <span class="status">${game.status}</span>
        `;
        row.addEventListener('click', () => {
          window.courtside.openGame({
            gameId: game.gameId,
            awayTricode: game.awayTricode,
            homeTricode: game.homeTricode,
          });
        });
        gameList.appendChild(row);
      });
    }

    // Premier League: deliberately no score in this data at all (see
    // getEplHomeData in main.js) — clicking a match searches within the
    // official @premierleague YouTube channel only, never a general
    // search, so results are always official highlights.
    const eplHeading = document.getElementById('epl-heading');
    const eplList = document.getElementById('epl-list');

    function renderEplMatches(eplData) {
      eplHeading.textContent = eplData.heading;
      eplList.innerHTML = '';
      if (eplData.matches.length === 0) {
        eplList.innerHTML = '<div class="home-empty">No matches to show right now.</div>';
        return;
      }
      eplData.matches.forEach((match) => {
        const row = document.createElement('div');
        row.className = 'game-row';
        row.innerHTML = `
          <span class="matchup">
            <img class="team-crest" src="${match.homeCrest}" onerror="this.style.display='none'">
            ${match.homeName} v ${match.awayName}
            <img class="team-crest" src="${match.awayCrest}" onerror="this.style.display='none'">
          </span>
          <span class="status">${match.date}</span>
        `;
        row.addEventListener('click', () => {
          window.courtside.openEplMatch({ awayName: match.awayName, homeName: match.homeName });
        });
        eplList.appendChild(row);
      });
    }

    showHome();
    loadHomeView();

    function buildPaneCell(index, label, skipCapable) {
      skipCapableByIndex.set(index, skipCapable);

      const cell = document.createElement('div');
      cell.className = 'pane-cell';

      const controlsHtml = skipCapable
        ? `
          <div class="pane-controls">
            <button data-quarter="1" disabled>Q1</button>
            <button data-quarter="2" disabled>Q2</button>
            <button data-quarter="3" disabled>Q3</button>
            <button data-quarter="4" disabled>Q4</button>
            <span class="skip-status nudge">loading&hellip;</span>
            <button class="nudge-prev" disabled>&lsaquo;</button>
            <button class="nudge-next" disabled>&rsaquo;</button>
          </div>
        `
        : `<div class="pane-controls"></div>`;

      cell.innerHTML = `
        <div class="pane-label">
          <span class="pane-dot"></span>
          <span>${label}</span>
        </div>
        ${controlsHtml}
        <div class="pane-content">
          <div class="skeleton">
            <div class="skeleton-bar"></div>
            <div class="skeleton-bar"></div>
          </div>
          <div class="error-state">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
            </svg>
            <div class="error-message">Stream failed to load.</div>
            <button class="retry-btn">Retry</button>
          </div>
        </div>
      `;
      cell.querySelector('.pane-label').addEventListener('click', () => {
        window.courtside.focusPane(index);
      });
      cell.querySelector('.retry-btn').addEventListener('click', () => {
        window.courtside.retryPane(index);
      });
      if (skipCapable) {
        cell.querySelectorAll('.pane-controls button[data-quarter]').forEach((btn) => {
          btn.addEventListener('click', () => {
            window.courtside.jumpToQuarter(index, Number(btn.dataset.quarter));
          });
        });
        cell.querySelector('.nudge-prev').addEventListener('click', () => {
          window.courtside.nudgeQuarter(index, 'prev');
        });
        cell.querySelector('.nudge-next').addEventListener('click', () => {
          window.courtside.nudgeQuarter(index, 'next');
        });
      }
      return cell;
    }

    // Draggable divider — only meaningful for exactly 2 panes (matches
    // main.js's layoutPanes, which only understands a splitRatio for
    // n===2; a future 4-up grid would need per-row/column dividers).
    let splitRatio = 0.5;

    function setSplitRatio(ratio, cellA, cellB) {
      splitRatio = Math.max(0.2, Math.min(0.8, ratio));
      cellA.style.flex = `0 0 ${splitRatio * 100}%`;
      cellB.style.flex = `0 0 ${(1 - splitRatio) * 100}%`;
      window.courtside.setSplitRatio(splitRatio);
    }

    function buildDivider(cellA, cellB) {
      const divider = document.createElement('div');
      divider.className = 'divider';
      let dragging = false;

      const onMove = (e) => {
        if (!dragging) return;
        const gridRect = grid.getBoundingClientRect();
        setSplitRatio((e.clientX - gridRect.left) / gridRect.width, cellA, cellB);
      };
      const onUp = () => {
        dragging = false;
        divider.classList.remove('dragging');
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      divider.addEventListener('mousedown', () => {
        dragging = true;
        divider.classList.add('dragging');
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });
      return divider;
    }

    window.courtside.onPanesConfig((panes) => {
      grid.innerHTML = '';
      cells.clear();
      panes.forEach(({ index, label, skipCapable }) => {
        const cell = buildPaneCell(index, label, skipCapable);
        grid.appendChild(cell);
        cells.set(index, cell);
      });
      if (panes.length === 2) {
        const [cellA, cellB] = [cells.get(panes[0].index), cells.get(panes[1].index)];
        cellA.style.flex = `0 0 ${splitRatio * 100}%`;
        cellB.style.flex = `0 0 ${(1 - splitRatio) * 100}%`;
        grid.insertBefore(buildDivider(cellA, cellB), cellB);
      }
    });

    window.courtside.onPaneStatus(({ index, state, message }) => {
      const cell = cells.get(index);
      if (!cell) return;
      cell.querySelector('.skeleton').style.display = state === 'loading' ? 'flex' : 'none';
      const errorEl = cell.querySelector('.error-state');
      errorEl.style.display = state === 'error' ? 'flex' : 'none';
      if (state === 'error') {
        cell.querySelector('.error-message').textContent = message || 'Stream failed to load.';
      }
    });

    window.courtside.onFocusChanged(({ index }) => {
      cells.forEach((cell, i) => {
        cell.classList.toggle('focused', i === index);
      });
    });

    // Quarter/nudge buttons are only enabled once the focused pane's
    // manifest is captured AND confirmed to be a VOD with usable
    // discontinuity data — never for a still-live game (skipping to a
    // quarter that hasn't happened yet is meaningless), matching the
    // v1 scope decision that Q2/Q4 are a coarse hint requiring the
    // nudge buttons, not a guaranteed-precise jump.
    window.courtside.onPaneSkipState(({ index, ready, reason }) => {
      const cell = cells.get(index);
      if (!cell || !skipCapableByIndex.get(index)) return;
      cell.querySelectorAll('.pane-controls button').forEach((btn) => {
        btn.disabled = !ready;
      });
      const status = cell.querySelector('.skip-status');
      if (status) status.textContent = ready ? '' : reason || 'loading…';
    });
  </script>
</body>
</html>
